<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Clock</title>
  <style>
    body {
      background-color: #000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      font-weight: bold;
    }

    #clock {
      font-size: 87px;
      letter-spacing: 2px;
    }

    #date {
      font-size: 25px;
      margin-top: 10px;
    }

    #msg {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="msg"><br>✨️ GLDNTM IS RNNG | STY FCSD 📚<br>U HV ALRD WSTD A LT OF TM<br><br>BT, EVRON IS WTNG FR UR AURA STS 🔥<br>(BGM WL BE GVN BY SBH AFT SLCTN)<br><br>U WL ND TO PRV URSLF TO<br>KP THM SLNT FRVR IN FRNT OF U<br><br>NO QT, TNT, MSG IN SLCTN STS<br>UR AURA & TRU SML WL B TH<br>ANS FR AL OF THM</div>

  <script>
    function updateClock() {
      const now = new Date();

      // Get time parts
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      // Convert to 12-hour format
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12; // convert 0 to 12

      // Pad with leading zeros
      hours = hours.toString().padStart(2, '0');
      minutes = minutes.toString().padStart(2, '0');
      seconds = seconds.toString().padStart(2, '0');

      // Display time
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      // Display date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateString = now.toLocaleDateString('en-US', options);
      document.getElementById('date').textContent = dateString;
    }

    // Update every second
    setInterval(updateClock, 1000);
    updateClock(); // initial call
  </script>
</body>
</html>
