<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Clock</title>
  <style>
    body {
      background-color: #000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      font-weight: bold;
      overflow: hidden; /* prevent scroll bounce */
    }

    #clock {
      font-size: 95px;
      letter-spacing: 2px;
    }

    #date {
      font-size: 25px;
      margin-top: 10px;
    }

    #msg {
      font-size: 18px;
      margin-top: 10px;
    }

    #toggleBtn, #unlockBtn {
      position: fixed;
      bottom: 20px;
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      z-index: 1003;
      transition: background 0.3s;
    }

    #toggleBtn:hover, #unlockBtn:hover {
      background-color: #555;
    }

    #toggleBtn { right: 20px; }
    #unlockBtn { left: 20px; display: none; }

    /* 🚫 Overlay blocks all interaction including touch */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0); /* transparent */
      z-index: 1002;
      display: none;
      touch-action: none; /* prevent touch gestures */
      pointer-events: all;
    }

    /* Disable scrolling globally when locked */
    body.locked {
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="msg"><br>✨️ GLDNTM IS RNNG | STY FCSD 📚<br><br>EVRON IS WTNG FR UR AURA STS 🔥<br><br>U WL ND TO PRV URSLF TO KP THM<br>SLNT FRVR IN FRNT OF U</div>

  <button id="toggleBtn">Disable Screen</button>
  <button id="unlockBtn">Enable Screen</button>
  <div id="overlay"></div>

  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      hours = hours.toString().padStart(2, '0');
      minutes = minutes.toString().padStart(2, '0');
      seconds = seconds.toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    const overlay = document.getElementById('overlay');
    const toggleBtn = document.getElementById('toggleBtn');
    const unlockBtn = document.getElementById('unlockBtn');

    // Disable screen
    toggleBtn.addEventListener('click', () => {
      overlay.style.display = 'block';
      document.body.classList.add('locked');
      toggleBtn.style.display = 'none';
      unlockBtn.style.display = 'block';
    });

    // Enable screen
    unlockBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      document.body.classList.remove('locked');
      unlockBtn.style.display = 'none';
      toggleBtn.style.display = 'block';
    });

    // Prevent accidental scrolls/taps on overlay
    overlay.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    overlay.addEventListener('click', e => e.preventDefault());
  </script>
</body>
</html>
