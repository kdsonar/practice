<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Clock</title>
  <style>
    body {
      background-color: #000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      font-weight: bold;
    }

    #clock {
      font-size: 95px;
      letter-spacing: 2px;
    }

    #date {
      font-size: 25px;
      margin-top: 10px;
    }

    #msg {
      font-size: 18px;
      margin-top: 10px;
    }

    /* 🔘 Toggle button */
    #toggleBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      z-index: 1002;
      transition: background 0.3s;
    }

    #toggleBtn:hover {
      background-color: #555;
    }

    /* 🚫 Transparent overlay to block input */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0); /* fully transparent */
      z-index: 1001;
      display: none;
      pointer-events: all; /* capture clicks to block them */
    }

    /* Unlock hint text */
    #unlockBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      z-index: 1003;
      display: none;
    }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="msg"><br>✨️ GLDNTM IS RNNG | STY FCSD 📚<br><br>EVRON IS WTNG FR UR AURA STS 🔥<br><br>U WL ND TO PRV URSLF TO KP THM<br>SLNT FRVR IN FRNT OF U</div>

  <!-- Buttons + invisible overlay -->
  <button id="toggleBtn">Disable Screen</button>
  <div id="overlay"></div>
  <button id="unlockBtn">Enable Screen</button>

  <script>
    function updateClock() {
      const now = new Date();

      // Get time parts
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      // Convert to 12-hour format
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      // Pad with leading zeros
      hours = hours.toString().padStart(2, '0');
      minutes = minutes.toString().padStart(2, '0');
      seconds = seconds.toString().padStart(2, '0');

      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    // 🟢 Disable screen (block clicks)
    const overlay = document.getElementById('overlay');
    const toggleBtn = document.getElementById('toggleBtn');
    const unlockBtn = document.getElementById('unlockBtn');

    toggleBtn.addEventListener('click', () => {
      overlay.style.display = 'block'; // block screen
      toggleBtn.style.display = 'none';
      unlockBtn.style.display = 'block';
    });

    unlockBtn.addEventListener('click', () => {
      overlay.style.display = 'none'; // unblock screen
      unlockBtn.style.display = 'none';
      toggleBtn.style.display = 'block';
    });
  </script>
</body>
</html>
