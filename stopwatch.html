<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Precision Toggle Stopwatch</title>
    <style>
        /* Reset & Core Canvas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f11;
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Fullscreen Toggle Button */
        .fullscreen-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid #27272a;
            color: #71717a;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        /* Hide fullscreen button completely on iOS Safari due to lack of standard support */
        @supports (-webkit-touch-callout: none) and (not (sidebar-color: unset)) {
            .fullscreen-btn {
                display: none;
            }
        }

        .fullscreen-btn:hover {
            color: #f4f4f5;
            border-color: #3f3f46;
            background: #18181b;
        }

        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Stopwatch Container */
        .stopwatch-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            user-select: none;
        }

        /* Time Display Container */
        .time-display {
            font-weight: 300;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #f4f4f5;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: baseline;
            justify-content: center;
            width: 100%;
        }

        /* Main Clock Face (HH:MM:SS) */
        .main-time {
            font-size: clamp(3rem, 12vw, 6.5rem);
            transition: font-size 0.2s ease;
        }

        /* Milliseconds Separator & Digits */
        .ms-time {
            font-size: clamp(1.6rem, 6vw, 3.5rem);
            color: #71717a;
            margin-left: 0.15rem;
            font-weight: 200;
            transition: font-size 0.2s ease;
        }

        /* SMART MOBILE FULLSCREEN OPTIMIZATIONS */
        
        /* 1. If screen is in landscape (short & wide) like a turned phone */
        @media (max-height: 450px) {
            .stopwatch-container {
                gap: 1rem;
            }
            .main-time {
                font-size: clamp(3rem, 15vh, 5.5rem);
            }
            .ms-time {
                font-size: clamp(1.5rem, 8vh, 2.8rem);
            }
            .btn {
                padding: 0.6rem 0 !important;
                font-size: 0.95rem !important;
            }
        }

        /* 2. When native fullscreen is activated */
        :fullscreen .main-time {
            /* Scales cleanly based on viewport height OR width, whichever is tighter */
            font-size: clamp(4rem, min(16vw, 16vh), 11rem);
        }
        
        :fullscreen .ms-time {
            font-size: clamp(2rem, min(8vw, 8vh), 5.5rem);
        }

        /* Controls Layout */
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            width: 100%;
            max-width: 340px;
        }

        /* Shared Button Aesthetics */
        .btn {
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #27272a;
            padding: 0.9rem 0;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            flex: 1;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .btn:hover {
                color: #f4f4f5;
                background: #27272a;
                border-color: #3f3f46;
                transform: translateY(-1px);
            }
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Combined Toggle Button - Active States */
        .btn-toggle.running {
            background: #451a03; 
            color: #fdba74;
            border-color: #78350f;
        }

        @media (hover: hover) {
            .btn-toggle.running:hover {
                background: #78350f;
                border-color: #9a3412;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
    </button>

    <div class="stopwatch-container">
        <div class="time-display">
            <span class="main-time" id="mainDisplay">00:00:00</span>
            <span class="ms-time" id="msDisplay">.00</span>
        </div>
        
        <div class="controls">
            <button class="btn btn-toggle" id="toggleBtn">Start</button>
            <button class="btn" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const mainDisplay = document.getElementById('mainDisplay');
        const msDisplay = document.getElementById('msDisplay');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fsIcon = document.getElementById('fsIcon');

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        function updateTimeStrings(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let centiseconds = Math.floor((ms % 1000) / 10);

            const pad = (num) => String(num).padStart(2, '0');

            mainDisplay.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            msDisplay.textContent = `.${pad(centiseconds)}`;
        }

        function handleToggle() {
            if (!isRunning) {
                isRunning = true;
                toggleBtn.textContent = 'Stop';
                toggleBtn.classList.add('running');
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateTimeStrings(elapsedTime);
                }, 10);
            } else {
                isRunning = false;
                toggleBtn.textContent = 'Start';
                toggleBtn.classList.remove('running');
                clearInterval(timerInterval);
            }
        }

        function reset() {
            isRunning = false;
            clearInterval(timerInterval);
            toggleBtn.textContent = 'Start';
            toggleBtn.classList.remove('running');
            elapsedTime = 0;
            updateTimeStrings(0);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch(err => console.log(`Fullscreen error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsIcon.innerHTML = '<path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"></path>';
            } else {
                fsIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            }
        });

        toggleBtn.addEventListener('click', handleToggle);
        resetBtn.addEventListener('click', reset);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
    </script>
</body>
</html>
