<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stopwatch</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/media/favicon16.png">
    <meta name="theme-color" content="#0f0f11">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f11;
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Stopwatch Wrapper Layout */
        .stopwatch-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Time Display Container */
        .time-display {
            font-weight: 300;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin-bottom: 2.5rem;
            color: #f4f4f5;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: baseline;
            justify-content: center;
            width: 100%;
        }

        /* Main Clock Face (HH:MM:SS) */
        .main-time {
            font-size: clamp(2.5rem, 11vw, 5.5rem);
            transition: font-size 0.2s ease;
        }

        /* Milliseconds Separator & Digits */
        .ms-time {
            font-size: clamp(1.4rem, 6vw, 2.8rem);
            color: #71717a;
            margin-left: 0.15rem;
            font-weight: 200;
            transition: font-size 0.2s ease;
        }

        /* --- STRICT LANDSCAPE OVERRIDES --- */
        @media screen and (max-height: 450px) and (orientation: landscape) {
            .time-display {
                margin-bottom: 1.25rem;
            }
            .main-time {
                font-size: clamp(3rem, 16vh, 5rem) !important;
            }
            .ms-time {
                font-size: clamp(1.6rem, 9vh, 2.5rem) !important;
            }
            .btn {
                padding: 0.55rem 0 !important;
                font-size: 1.55rem !important;
            }
        }

        /* Controls Layout */
        .controls {
            display: flex;
            gap: 0.85rem;
            justify-content: center;
            width: 100%;
        }

        /* Shared Button Aesthetics */
        .btn {
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #27272a;
            padding: 0.85rem 0;
            font-size: 1.9rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            flex: 1; 
            max-width: 140px;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .btn:hover {
                color: #f4f4f5;
                background: #27272a;
                border-color: #3f3f46;
            }
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-toggle.running {
            background: #451a03; 
            color: #fdba74;
            border-color: #78350f;
        }
    </style>
</head>
<body>
    <div class="stopwatch-container">
        <div class="time-display">
            <span class="main-time" id="mainDisplay">00:00:00</span>
            <span class="ms-time" id="msDisplay">.00</span>
        </div>        
        <div class="controls">
            <button class="btn btn-toggle" id="toggleBtn">Start</button>
            <button class="btn" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const mainDisplay = document.getElementById('mainDisplay');
        const msDisplay = document.getElementById('msDisplay');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        function updateTimeStrings(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let centiseconds = Math.floor((ms % 1000) / 10);

            const pad = (num) => String(num).padStart(2, '0');
            mainDisplay.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            msDisplay.textContent = `.${pad(centiseconds)}`;
        }

        function handleToggle() {
            if (!isRunning) {
                isRunning = true;
                toggleBtn.textContent = 'Stop';
                toggleBtn.classList.add('running');
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateTimeStrings(elapsedTime);
                }, 10);
            } else {
                isRunning = false;
                toggleBtn.textContent = 'Start';
                toggleBtn.classList.remove('running');
                clearInterval(timerInterval);
            }
        }

        function reset() {
            isRunning = false;
            clearInterval(timerInterval);
            toggleBtn.textContent = 'Start';
            toggleBtn.classList.remove('running');
            elapsedTime = 0;
            updateTimeStrings(0);
        }

        toggleBtn.addEventListener('click', handleToggle);
        resetBtn.addEventListener('click', reset);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
