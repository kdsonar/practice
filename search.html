<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube & Google Search</title>

  <!-- Favicon (YouTube as default) -->
  <link rel="icon" href="https://www.youtube.com/favicon.ico" type="image/x-icon">

  <!-- Google Font: Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding: 50px 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .search-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    .search-container img {
      height: 30px;
      vertical-align: middle;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0;
    }

    form {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #999;
    }

    button {
      padding: 10px 20px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background-color: #333;
    }

    .google button {
      background-color: #4285F4;
    }

    .google button:hover {
      background-color: #3367D6;
    }

    .youtube button {
      background-color: #cc0000;
    }

    .youtube button:hover {
      background-color: #b30000;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- YouTube Search (on top) -->
    <div class="search-container youtube">
      <img src="https://www.youtube.com/favicon.ico" alt="YouTube Logo" style="height:28px;">
      <h2>Search on YouTube</h2>
      <form id="youtubeSearchForm">
        <input type="text" id="youtubeSearchInput" placeholder="Type something..." required>
        <button type="submit">Search</button>
      </form>
    </div>

    <!-- Google Search (below) -->
    <div class="search-container google">
      <img src="https://www.google.com/images/branding/product/ico/googleg_lodp.ico" alt="Google Logo">
      <h2>Search on Google</h2>
      <form id="googleSearchForm">
        <input type="text" id="googleSearchInput" placeholder="Type something..." required>
        <button type="submit">Search</button>
      </form>
    </div>
  </div>

  <script>
    // YouTube Search
    document.getElementById("youtubeSearchForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const query = document.getElementById("youtubeSearchInput").value.trim();
      if (query !== "") {
        const youtubeURL = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
        window.location.href = youtubeURL;
      }
    });

    // Google Search
    document.getElementById("googleSearchForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const query = document.getElementById("googleSearchInput").value.trim();
      if (query !== "") {
        const googleURL = "https://www.google.com/search?q=" + encodeURIComponent(query);
        window.location.href = googleURL;
      }
    });
  </script>

</body>
</html>
