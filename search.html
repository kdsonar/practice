<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube & Google Search</title>

  <!-- Favicon (YouTube as default) -->
  <link rel="icon" href="media/yt16.png" type="image/x-icon">

  <!-- Google Font: Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f9f9f9;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding: 5vh 1rem;
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
    }

    .search-container img {
      max-height: 40px;
      height: auto;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0;
      font-size: 1.5rem;
    }

    form {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1 1 250px;
      min-width: 200px;
      padding: 0.7rem;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #999;
    }

    button {
      padding: 0.7rem 1.5rem;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #333;
    }

    .google button {
      background-color: #4285F4;
    }

    .google button:hover {
      background-color: #3367D6;
    }

    .youtube button {
      background-color: #cc0000;
    }

    .youtube button:hover {
      background-color: #b30000;
    }

    /* Responsive tweaks */
    @media (max-width: 600px) {
      h2 {
        font-size: 1.25rem;
      }

      input[type="text"], button {
        width: 100%;
        flex: 1 1 100%;
      }

      form {
        flex-direction: column;
        align-items: stretch;
      }

      .search-container {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- YouTube Search -->
    <div class="search-container youtube">
      <img src="media/yt.png" alt="YouTube Logo">
      <h2>Search on YouTube</h2>
      <form id="youtubeSearchForm" autocomplete="off">
        <input type="text" id="youtubeSearchInput" placeholder="Type something..." required>
        <button type="submit">Search</button>
      </form>
    </div>

    <!-- Google Search -->
    <div class="search-container google">
      <img src="media/search.png" alt="Google Logo">
      <h2>Search on Google</h2>
      <form id="googleSearchForm" autocomplete="off">
        <input type="text" id="googleSearchInput" placeholder="Type something..." required>
        <button type="submit">Search</button>
      </form>
    </div>
  </div>

  <script>
    // YouTube Search
    document.getElementById("youtubeSearchForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const query = document.getElementById("youtubeSearchInput").value.trim();
      if (query !== "") {
        const youtubeURL = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
        window.location.href = youtubeURL;
      }
    });

    // Google Search
    document.getElementById("googleSearchForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const query = document.getElementById("googleSearchInput").value.trim();
      if (query !== "") {
        const googleURL = "https://www.google.com/search?q=" + encodeURIComponent(query);
        window.location.href = googleURL;
      }
    });
  </script>

</body>
</html>
