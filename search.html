<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Google Search</title>
  <script>
    // If Chrome passes a query in the URL (e.g. index.html?q=cricket), redirect immediately
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');
    if (query) {
      window.location.replace(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #121214; color: #e4e4e7; }
    .search-wrapper { width: 100%; max-width: 580px; padding: 20px; text-align: center; }
    h1 { font-size: 2.2rem; font-weight: 600; margin-bottom: 24px; color: #f4f4f5; }
    .search-form { display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 14px 20px; font-size: 1rem; color: #f4f4f5; background-color: #1e1e24; border: 1px solid #2e2e38; border-radius: 28px; outline: none; }
    .search-input:focus { border-color: #6366f1; }
    .search-button { padding: 14px 24px; font-size: 0.95rem; font-weight: 500; color: #fff; background-color: #4f46e5; border: none; border-radius: 28px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="search-wrapper">
    <h1>Search</h1>
    <form class="search-form" action="https://www.google.com/search" method="GET">
      <input type="text" name="q" class="search-input" placeholder="Type your search..." autocomplete="off" autofocus required>
      <button type="submit" class="search-button">Search</button>
    </form>
  </div>
</body>
</html>
